[project]
name = "async-report-engine"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
# Docker runtime is 3.11; pinned to py310 so the code also runs on a local
# 3.10 venv (avoids UP017 rewriting to datetime.UTC).
target-version = "py310"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's Depends()/Header() in defaults is the documented pattern.
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
