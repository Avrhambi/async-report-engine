[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ignore B008 (FastAPI Depends)
ignore = ["B008"]
extend-select = ["B", "TRY", "I"]
[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true
